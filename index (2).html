<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>מטרו-טק — תחנת התואר</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; direction: rtl; background: #020C1B; color: #fff; }

.page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
.center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.scroll-page { min-height: 100vh; padding: 20px; display: flex; align-items: flex-start; justify-content: center; }
.card { background: rgba(4,20,50,0.85); border: 1px solid rgba(0,184,217,0.25); border-radius: 20px; padding: 28px 24px; max-width: 400px; width: 100%; box-shadow: 0 0 30px rgba(0,120,200,0.15), inset 0 1px 0 rgba(255,255,255,0.06); }
.logo-wrap { text-align: center; margin-bottom: 20px; }
.logo-text { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -1px; }
.logo-stripes { display: flex; gap: 3px; justify-content: center; margin-top: 5px; }
.stripe { height: 4px; width: 36px; border-radius: 2px; }
.stations-track { display: flex; align-items: center; justify-content: center; margin: 14px 0 20px; }
.track-connector { flex: 1; height: 2px; background: rgba(255,255,255,0.15); }
.sdot-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sdot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); }
.sdot.on { border-color: #00AAFF; background: #00AAFF; box-shadow: 0 0 6px #00AAFF; }
.sdot.cur { border-color: #F5A623; background: #F5A623; box-shadow: 0 0 6px #F5A623; }
.slabel { font-size: 9px; color: rgba(255,255,255,0.4); white-space: nowrap; }
.slabel.cur { color: #F4A261; font-weight: 700; }
h2 { font-size: 22px; font-weight: 700; text-align: center; color: #fff; margin-bottom: 4px; }
.sub { font-size: 13px; color: rgba(255,255,255,0.45); text-align: center; margin-bottom: 20px; }
.lbl { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); display: block; margin: 16px 0 7px; letter-spacing: 0.05em; }
input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; font-size: 15px; direction: rtl; font-family: inherit; outline: none; color: #fff; }
input:focus { border-color: #00C9A7; }
.sbtn { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1.5px solid rgba(255,255,255,0.12); border-radius: 10px; cursor: pointer; font-size: 14px; margin-bottom: 7px; width: 100%; font-family: inherit; text-align: right; background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.75); transition: all 0.15s; }
.sbtn.sel { border-color: #00C9A7; background: rgba(0,201,167,0.13); color: #fff; font-weight: 600; }
.id-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 6px; }
.ibtn { aspect-ratio:1; border-radius: 10px; border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: all 0.15s; }
.ibtn.sel { border-color: #fff; transform: scale(1.1); }
.btn { border: none; border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 12px; font-family: inherit; transition: opacity 0.15s; }
.btn:disabled { opacity: 0.35; cursor: default; }
.bp { background: linear-gradient(135deg,#0066FF,#00CCFF); color: #fff; box-shadow: 0 0 16px rgba(0,150,255,0.4); }
.bg { background: #059669; color: #fff; }
.bv { background: #7C3AED; color: #fff; font-size: 15px; }
.bd { background: #334155; color: #fff; }
.br { background: #DC2626; color: #fff; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.ibox { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.abox { margin-top: 14px; padding: 14px; background: rgba(253,230,138,0.07); border: 1px solid rgba(253,230,138,0.25); border-radius: 12px; }
.atitle { font-weight: 700; font-size: 13px; color: #FDE68A; margin-bottom: 10px; }
.mbox { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 18px; width: 100%; margin-bottom: 12px; }
.qbox { border-radius: 14px; padding: 18px; width: 100%; }
.qbox.on { background: rgba(0,153,255,0.13); border: 1px solid rgba(0,153,255,0.28); }
.qbox.off { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); }
.bigbadge { width: 64px; height: 64px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.15); }
.rdots { display: flex; gap: 5px; margin-bottom: 12px; justify-content: center; }
.rdot { height: 5px; border-radius: 3px; transition: all 0.3s; }
.chip { background: rgba(99,102,241,0.2); color: #A5B4FC; border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 600; display: inline-block; }
</style>
</head>
<body>
<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0" preserveAspectRatio="none" viewBox="0 0 400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g1"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M-20,130 C60,120 100,145 180,125 C260,105 300,140 420,118" stroke="#57CC99" stroke-width="2" fill="none" opacity="0.4" filter="url(#g1)"/>
  <path d="M-20,310 C50,330 120,295 200,320 C280,345 340,300 420,325" stroke="#F5A623" stroke-width="2" fill="none" opacity="0.35" filter="url(#g1)"/>
  <path d="M-20,490 C80,470 130,510 210,488 C290,466 350,505 420,480" stroke="#FF2D78" stroke-width="2" fill="none" opacity="0.35" filter="url(#g1)"/>
  <path d="M-20,670 C70,690 140,655 220,675 C300,695 360,660 420,678" stroke="#00B8D9" stroke-width="2" fill="none" opacity="0.4" filter="url(#g1)"/>
  <path d="M-20,840 C90,820 150,855 230,835 C310,815 370,848 420,830" stroke="#57CC99" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M-20,200 C100,215 180,185 260,205 C340,225 380,195 420,210" stroke="#00B8D9" stroke-width="1" fill="none" opacity="0.15"/>
  <path d="M-20,580 C80,560 160,595 240,572 C320,549 380,582 420,565" stroke="#FF2D78" stroke-width="1" fill="none" opacity="0.15"/>
</svg>
<div id="app"><div class="page"><div class="center"><p style="color:rgba(255,255,255,0.35)">טוען...</p></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
const db = getDatabase(initializeApp({ databaseURL:"https://atidim-d386e-default-rtdb.europe-west1.firebasedatabase.app" }));

const STATIONS=[
  {id:"pre",    label:"קדם מכינה",            emoji:"🌱",color:"#059669",bg:"rgba(5,150,105,0.2)",  txt:"#6EE7B7"},
  {id:"mechina",label:"מכינה",                emoji:"📖",color:"#2563EB",bg:"rgba(37,99,235,0.2)", txt:"#93C5FD"},
  {id:"degree", label:"סטודנט.ית לתואר",      emoji:"🎓",color:"#7C3AED",bg:"rgba(124,58,237,0.2)",txt:"#C4B5FD"},
  {id:"post",   label:"עובד.ת / לקראת היי-טק",emoji:"💼",color:"#B45309",bg:"rgba(180,83,9,0.2)",  txt:"#FCD34D"},
];
const BADGES=[
  {e:"🔴",bg:"#7F1D1D"},{e:"🟠",bg:"#78350F"},{e:"🟡",bg:"#713F12"},
  {e:"🟢",bg:"#14532D"},{e:"🔵",bg:"#1E3A5F"},{e:"🟣",bg:"#4C1D95"},
  {e:"🩷",bg:"#881337"},{e:"⚪",bg:"#1E293B"},{e:"🔷",bg:"#164E63"},
  {e:"🟤",bg:"#431407"},
];
const QUESTIONS=[
  "מה גרם לך לבחור או לשקול את הדרך לעולם ההייטק?",
  "מה היה יותר קשה או מבלבל ממה שציפית? / מה נראה לך שיהיה הכי קשה?",
  "טעות שעשית בדרך — או טעות שאתה.את חושש.ת לעשות",
  "מה עזר לך להמשיך כשהיה קשה? / מה לדעתך יעזור לך לא לוותר?",
];
const ROUNDS=4, SECS=240, C=2*Math.PI*52;

let myId=localStorage.getItem("conf_myid"), conf=null, parts=[];
let timerTO=null, adminMode=false, tapN=0, tapTO=null;
let selSt=localStorage.getItem("conf_station")||"";
let selBd=localStorage.getItem("conf_badge")||"";

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const stOf=id=>STATIONS.find(s=>s.id===id)||STATIONS[0];
const bdOf=e=>BADGES.find(b=>b.e===e)||BADGES[7];
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

onValue(ref(db,"conf"),snap=>{
  const d=snap.val()||{};
  conf=d.state||null;
  parts=d.participants?Object.values(d.participants):[];
  render();
});

function buildPairings(ps,rounds){
  const met={};ps.forEach(p=>met[p.id]={});
  return Array.from({length:rounds},()=>{
    const pools=STATIONS.map(s=>[...ps.filter(p=>p.station===s.id)].sort(()=>Math.random()-.5));
    const iv=[];const ml=Math.max(...pools.map(a=>a.length),0);
    for(let i=0;i<ml;i++) pools.forEach(a=>a[i]&&iv.push(a[i]));
    const used={},pairs=[];
    for(const a of iv){
      if(used[a.id]) continue;
      let best=null,bs=-Infinity;
      for(const b of iv){if(b.id===a.id||used[b.id]) continue;const sc=(a.station!==b.station?3:0)+(!met[a.id][b.id]?2:0)+Math.random();if(sc>bs){bs=sc;best=b;}}
      if(best){pairs.push({ids:[a.id,best.id]});used[a.id]=used[best.id]=true;met[a.id][best.id]=met[best.id][a.id]=true;}
    }
    const odd=iv.find(p=>!used[p.id]);
    if(odd&&pairs.length>0) pairs[pairs.length-1].ids.push(odd.id);
    return pairs;
  });
}

function screen(){
  if(!myId||!parts.some(p=>p.id===myId)) return "reg";
  if(!conf||conf.phase==="registration") return "wait";
  return conf.phase;
}
function render(){clearTimeout(timerTO);const s=screen();if(s==="reg")rReg();else if(s==="wait")rWait();else if(s==="meeting")rMeet();else if(s==="between")rBetween();else rDone();}

const LOGO=`<div class="logo-wrap"><svg width="180" height="54" viewBox="0 0 180 54" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto">
  <text x="90" y="36" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-1">מטרו-טק</text>
  <g transform="translate(163,6)">
    <polygon points="0,0 14,0 10,11 -4,11" fill="#57CC99"/>
    <polygon points="0,13 14,13 10,24 -4,24" fill="#F5A623"/>
    <polygon points="0,26 14,26 10,37 -4,37" fill="#FF2D78"/>
    <polygon points="0,39 14,39 10,50 -4,50" fill="#00B8D9"/>
  </g>
</svg><div style="font-size:10px;color:rgba(255,255,255,0.35);text-align:center;margin-top:2px;letter-spacing:0.06em">תחנת התואר — קו כחול</div></div>`;
const TRACK=`<div class="stations-track"><div class="sdot-wrap"><div class="sdot on"></div><div class="slabel">קדם</div></div><div class="track-connector"></div><div class="sdot-wrap"><div class="sdot on"></div><div class="slabel">מכינה</div></div><div class="track-connector"></div><div class="sdot-wrap"><div class="sdot cur"></div><div class="slabel cur">תואר</div></div><div class="track-connector"></div><div class="sdot-wrap"><div class="sdot"></div><div class="slabel">השמה</div></div></div>`;
const tagH=id=>{const s=stOf(id);return `<span class="tag" style="background:${s.bg};color:${s.txt}">${s.emoji} ${s.label}</span>`;};
const abox=inner=>adminMode?`<div class="abox"><div class="atitle">🔧 פאנל מנחה</div>${inner}<button class="btn br" onclick="aReset()">🗑 איפוס מוחלט</button></div>`:"";

function rReg(){
  document.getElementById("app").innerHTML=`<div class="page"><div class="scroll-page"><div class="card" style="margin:auto">
    ${LOGO}${TRACK}
    <h2>ברוכים לכנס!</h2><p class="sub">מלאו פרטים קצרים להצטרפות</p>
    <label class="lbl">שם מלא</label>
    <input id="ni" autocomplete="name" oninput="chk()" onkeydown="if(event.key==='Enter')reg()"/>
    <label class="lbl">אני כרגע ב...</label>
    ${STATIONS.map(s=>`<button class="sbtn${selSt===s.id?" sel":""}" id="sb_${s.id}" onclick="setSt('${s.id}')"><span style="font-size:18px">${s.emoji}</span><span>${s.label}</span></button>`).join("")}
    <label class="lbl">איך יזהו אותך מהקצה השני של החדר?</label>
    <input id="bi" placeholder="למשל: חולצה כחולה, שיער קצר..." oninput="chk()" autocomplete="off"/>
    <p style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:5px;margin-bottom:4px">זה יוצג לשותף.ה שלך כדי שיוכל.י למצוא אותך</p>
    <button class="btn bp" id="rb" onclick="reg()" disabled>כניסה לכנס ✓</button>
    ${parts.length>0?`<p style="text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,0.3)">${parts.length} משתתפים כבר בפנים</p>`:""}
    ${abox(`<button class="btn bg" onclick="aStart()">▶ התחל סיבוב ראשון (${parts.length} נרשמו)</button>`)}
  </div></div></div>`;
  const sv=localStorage.getItem("conf_nick");if(sv) document.getElementById("ni").value=sv;
  const svb=localStorage.getItem("conf_badge");if(svb){const bi=document.getElementById("bi");if(bi)bi.value=svb;}
  chk();
}

function rWait(){
  const me=parts.find(p=>p.id===myId);
  document.getElementById("app").innerHTML=`<div class="page"><div class="center"><div class="card">
    ${LOGO}
    <h2 onclick="tap()">אתם בפנים!</h2>
    ${me?`<div style="text-align:center;margin:6px 0 4px">${tagH(me.station)}</div>`:""}
    <p class="sub">ממתינים למנחה שיתחיל את הסיבוב הראשון</p>
    <div class="ibox">
      <p style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.45);margin-bottom:10px">👥 בחדר עכשיו: ${parts.length} משתתפים</p>
      ${STATIONS.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="font-size:13px;color:rgba(255,255,255,0.65)">${s.emoji} ${s.label}</span><span class="tag" style="background:${s.bg};color:${s.txt}">${parts.filter(p=>p.station===s.id).length}</span></div>`).join("")}
    </div>
    ${abox(`<button class="btn bg" onclick="aStart()">▶ התחל סיבוב ראשון (${parts.length} משתתפים)</button>`)}
  </div></div></div>`;
}

function rMeet(){
  const rev=conf?.questionRevealed??false, r=conf?.currentRound??0, tot=conf?.totalRounds??ROUNDS;
  const Q=QUESTIONS[r%QUESTIONS.length], me=parts.find(p=>p.id===myId);
  const pair=(conf?.pairings?.[r]||[]).find(p=>p.ids.includes(myId));
  const partners=pair?pair.ids.filter(id=>id!==myId).map(id=>parts.find(p=>p.id===id)).filter(Boolean):[];
  const dots=Array.from({length:tot},(_,i)=>`<div class="rdot" style="background:${i<=r?"#00AAFF":"rgba(255,255,255,0.13)"};width:${i===r?"22px":"5px"}"></div>`).join("");
  const pHTML=partners.length===0?`<p style="color:rgba(255,255,255,0.3);font-size:14px">ממתין לשיבוץ...</p>`:partners.map(p=>{const s=stOf(p.station);return`<div style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="width:44px;height:44px;border-radius:50%;background:${s.bg};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${s.emoji}</div><div><p style="font-weight:700;font-size:19px;line-height:1.2;color:#fff">${p.nickname}</p><p style="margin-top:3px">${tagH(p.station)}</p></div></div>${p.badge?`<div style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(0,201,167,0.1);border:1px solid rgba(0,201,167,0.25);border-radius:8px"><span style="font-size:14px">👁</span><span style="font-size:14px;color:#6EE7B7;font-weight:600">${p.badge}</span></div>`:""}</div>`;}).join("");

  document.getElementById("app").innerHTML=`<div class="page"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
    <div class="logo-wrap" style="margin-bottom:8px"><div class="logo-text" style="font-size:20px">מטרו-טק</div><div class="logo-stripes">${["#57CC99","#F4A261","#E63946","#00B4D8"].map(c=>`<div class="stripe" style="background:${c};width:24px"></div>`).join("")}</div></div>
    <div class="rdots">${dots}</div>
    <p style="color:rgba(255,255,255,0.3);font-size:12px;margin-bottom:14px;letter-spacing:0.06em">סיבוב ${r+1} מתוך ${tot}</p>
    <div style="position:relative;margin-bottom:16px">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="${rev?"#00AAFF":"#334155"}" stroke-width="8"
          stroke-dasharray="${C}" stroke-dashoffset="0" stroke-linecap="round"
          style="transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset 1s linear" id="arc"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <span style="font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums" id="ttxt">${rev?fmt(SECS):"⏳"}</span>
      </div>
    </div>
    <div id="tdone"></div>
    <div style="padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;width:100%;max-width:400px;margin-bottom:12px">
      <p style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:3px">👁 הזיהוי שלך</p>
      <p style="font-size:15px;color:#fff;font-weight:600">${me?.badge||""}</p>
    </div>
    <div class="mbox" style="max-width:400px"><p style="font-size:11px;color:rgba(255,255,255,0.4);font-weight:700;margin-bottom:14px;letter-spacing:0.08em">🤝 פוגשים עכשיו</p>${pHTML}</div>
    <div class="qbox ${rev?"on":"off"}" style="max-width:400px">
      <p style="font-size:11px;color:${rev?"#93C5FD":"rgba(255,255,255,0.22)"};font-weight:700;margin-bottom:10px;letter-spacing:0.08em">💬 שאלה לשיחה</p>
      ${rev?`<p style="color:#DBEAFE;font-size:16px;line-height:1.7">${Q}</p>`:`<p style="color:rgba(255,255,255,0.22);font-size:14px;text-align:center">ממתינים למנחה שיציג את השאלה...</p>`}
    </div>
    ${adminMode?`<div style="width:100%;max-width:400px;margin-top:12px;display:flex;flex-direction:column;gap:6px">${!rev?`<button class="btn bv" onclick="aReveal()">▶ הצג שאלה והתחל טיימר</button>`:""} ${rev?`<button class="btn bd" onclick="aEnd()">⏸ סיים סיבוב</button>`:""}<button class="btn br" onclick="aReset()">🗑 איפוס</button></div>`:""}
  </div></div>`;

  if(rev&&conf?.timerStart){
    const tick=()=>{
      const left=Math.max(0,SECS-Math.floor((Date.now()-conf.timerStart)/1000));
      const arc=document.getElementById("arc"),t=document.getElementById("ttxt"),dm=document.getElementById("tdone");
      if(!arc)return;
      arc.setAttribute("stroke-dashoffset",C*(1-left/SECS));
      const done=left===0,urg=left>0&&left<=30;
      arc.setAttribute("stroke",done?"#EF4444":urg?"#F97316":"#00AAFF");
      if(t){t.textContent=done?"⏰":fmt(left);t.style.color=done?"#EF4444":"#fff";}
      if(dm)dm.innerHTML=done?`<div style="background:#7F1D1D;color:#FCA5A5;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:center">⏰ הזמן הסתיים — ממתינים למנחה</div>`:"";
      if(!done)timerTO=setTimeout(tick,500);
    };tick();
  }
}

function rBetween(){
  const r=conf?.currentRound??0,tot=conf?.totalRounds??ROUNDS,nr=r+1,done=nr>=tot;
  const np=done||!conf?.pairings?.[nr]?[]:(conf.pairings[nr]||[]).find(p=>p.ids.includes(myId))?.ids.filter(id=>id!==myId).map(id=>parts.find(p=>p.id===id)).filter(Boolean)||[];
  const nextH=!done&&np.length>0?`<div style="background:rgba(0,201,167,0.09);border:1px solid rgba(0,201,167,0.25);border-radius:12px;padding:16px;margin-bottom:14px"><p style="font-size:12px;font-weight:700;color:#6EE7B7;margin-bottom:12px">🎯 בסיבוב הבא תפגשו:</p>${np.map(p=>`<div style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:20px">${stOf(p.station).emoji}</span><span style="font-weight:700;font-size:18px;color:#fff">${p.nickname}</span>${tagH(p.station)}</div>${p.badge?`<div style="font-size:13px;color:#6EE7B7;padding-right:4px">👁 ${p.badge}</div>`:""}</div>`).join("")}</div>`:(!done?`<div style="background:rgba(234,179,8,0.08);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:#FDE68A;text-align:center">⚠️ לא נמצא שיבוץ — פנה.י למנחה</div>`:"");
  document.getElementById("app").innerHTML=`<div class="page"><div class="center"><div class="card">
    ${LOGO}
    <div style="text-align:center;font-size:38px;margin-bottom:4px">${done?"🏁":"🔔"}</div>
    <h2 onclick="tap()">${done?"כל הסיבובים הסתיימו!":`סיבוב ${r+1} הסתיים!`}</h2>
    <p class="sub">${done?"כל החיבורים הושלמו — כל הכבוד!":`ממתינים למנחה לסיבוב ${nr+1}`}</p>
    <div style="text-align:center;margin-bottom:14px"><span class="chip">סיבוב ${r+1} מתוך ${tot}</span></div>
    ${nextH}
    ${abox(!done?`<button class="btn bg" onclick="aNext()">▶ התחל סיבוב ${nr+1}</button>`:`<button class="btn bv" onclick="aNext()">🏁 סיים כנס</button>`)}
  </div></div></div>`;
}

function rDone(){
  document.getElementById("app").innerHTML=`<div class="page"><div class="center"><div class="card" style="text-align:center">
    ${LOGO}
    <div style="font-size:48px;margin-bottom:10px">🌟</div>
    <h2 onclick="tap()">תודה שהשתתפתם!</h2>
    <p class="sub">ניפגשנו, שוחחנו ולמדנו יחד — הדרך ממשיכה!</p>
    <div style="background:rgba(99,102,241,0.13);border:1px solid rgba(99,102,241,0.28);border-radius:14px;padding:20px;margin-top:14px">
      <p style="font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:4px">השתתפו בכנס</p>
      <p style="font-size:48px;font-weight:800;color:#A5B4FC">${parts.length}</p>
      <p style="font-size:14px;color:rgba(255,255,255,0.35);margin-top:4px">משתתפים</p>
    </div>
    ${adminMode?`<button class="btn br" style="margin-top:14px" onclick="aReset()">🗑 איפוס מוחלט</button>`:""}
  </div></div></div>`;
}

function tap(){clearTimeout(tapTO);tapN++;if(tapN>=5){adminMode=!adminMode;tapN=0;render();return;}tapTO=setTimeout(()=>tapN=0,3000);}
function setSt(id){selSt=id;localStorage.setItem("conf_station",id);document.querySelectorAll(".sbtn").forEach(b=>b.classList.remove("sel"));document.getElementById("sb_"+id)?.classList.add("sel");chk();}
function setBd(e){selBd=e;localStorage.setItem("conf_badge",e);document.querySelectorAll(".ibtn").forEach(b=>b.classList.remove("sel"));document.getElementById("bb_"+e)?.classList.add("sel");chk();}
function chk(){const n=document.getElementById("ni")?.value.trim(),b=document.getElementById("rb");if(b)b.disabled=!(n&&selSt&&document.getElementById('bi')?.value.trim());}
async function reg(){
  const n=document.getElementById("ni")?.value.trim();const bdVal=document.getElementById("bi")?.value.trim();if(!n||!selSt||!bdVal)return;
  if(!myId){myId=uid();localStorage.setItem("conf_myid",myId);}
  localStorage.setItem("conf_nick",n);
  await set(ref(db,`conf/participants/${myId}`),{id:myId,nickname:n,station:selSt,badge:selBd});
  const s=await get(ref(db,"conf/state"));
  if(!s.val()) await set(ref(db,"conf/state"),{phase:"registration",currentRound:0,totalRounds:ROUNDS,timerStart:null,questionRevealed:false,pairings:null});
}
async function aStart(){await set(ref(db,"conf/state"),{phase:"meeting",currentRound:0,totalRounds:ROUNDS,timerStart:null,questionRevealed:false,pairings:buildPairings(parts,ROUNDS)});}
async function aReveal(){await set(ref(db,"conf/state"),{...conf,timerStart:Date.now(),questionRevealed:true});}
async function aEnd(){await set(ref(db,"conf/state"),{...conf,phase:"between"});}
async function aNext(){const n=(conf.currentRound||0)+1;await set(ref(db,"conf/state"),n>=(conf.totalRounds||ROUNDS)?{...conf,phase:"done"}:{...conf,phase:"meeting",currentRound:n,timerStart:null,questionRevealed:false});}
async function aReset(){if(!confirm("איפוס מוחלט?"))return;await set(ref(db,"conf"),{state:{phase:"registration",currentRound:0,totalRounds:ROUNDS,timerStart:null,questionRevealed:false,pairings:null},participants:{}});localStorage.removeItem("conf_myid");localStorage.removeItem("conf_nick");localStorage.removeItem("conf_station");localStorage.removeItem("conf_badge");myId=null;selSt="";selBd="";adminMode=false;}

window.tap=tap;window.setSt=setSt;window.setBd=setBd;window.chk=chk;window.reg=reg;
window.aStart=aStart;window.aReveal=aReveal;window.aEnd=aEnd;window.aNext=aNext;window.aReset=aReset;
</script>
</body>
</html>
